<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>THE NEW</title>
<style>
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 800; src: url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-800-normal.woff2); }
  @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url(node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff2); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url(node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2); }
  html, body { margin: 0; background: #070504; color: #e9dccb; font: 12px "JetBrains Mono", monospace; }
  #film { display: block; width: 1280px; height: 720px; }
  #ui { display: none; padding: 10px 14px; gap: 12px; align-items: center; }
  body.preview #ui { display: flex; }
  body.preview #film { width: min(100vw, 1280px); height: auto; aspect-ratio: 16/9; }
  input[type=range] { flex: 1; accent-color: #ffaa60; }
  button { background: #1a120c; color: #ffd9a8; border: 1px solid #5a3a22; padding: 4px 10px; font: inherit; cursor: pointer; }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<canvas id="film" width="1280" height="720"></canvas>
<div id="ui"><button id="play">play</button><input id="scrub" type="range" min="0" max="1439" value="0" /><span id="fr">f 0000</span></div>
<script type="module">
  import './src/main.js';
  // PREVIEW ONLY: the wall clock picks *which* frame to show; renderFrame(f) itself never reads time.
  if (new URLSearchParams(location.search).has('preview')) {
    document.body.classList.add('preview');
    const scrub = document.getElementById('scrub'), fr = document.getElementById('fr'), btn = document.getElementById('play');
    const audio = new Audio('build/score.wav');
    let playing = false, t0 = 0, f0 = 0;
    const show = (f) => { window.THE_NEW.renderFrame(f); scrub.value = f; fr.textContent = 'f ' + String(f).padStart(4, '0'); };
    scrub.oninput = () => { playing = false; btn.textContent = 'play'; audio.pause(); show(+scrub.value); };
    btn.onclick = () => { playing = !playing; btn.textContent = playing ? 'pause' : 'play';
      if (playing) { f0 = +scrub.value; t0 = performance.now(); audio.currentTime = f0 / 30; audio.play().catch(() => {}); loop(); } else audio.pause(); };
    function loop() { if (!playing) return; const f = Math.min(1439, f0 + Math.floor((performance.now() - t0) / 1000 * 30)); show(f); if (f < 1439) requestAnimationFrame(loop); }
    show(0);
  }
</script>
</body>
</html>
